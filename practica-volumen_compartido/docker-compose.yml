version: '3.8'
services:
  apache1:
    image: httpd:alpine
    container_name: apache1
    volumes:
      - ./web_compartida:/usr/local/apache2/htdocs/
  apache2:
    image: httpd:alpine
    container_name: apache2
    volumes:
      - ./web_compartida:/usr/local/apache2/htdocs/
  nginx_lb:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - volumen_cache:/var/cache/nginx
    depends_on:
      - apache1
      - apache2
volumes:
  volumen_cache: